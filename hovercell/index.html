<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>호버방셀 제작기 · 테마형</title>
<style>
:root{--bg:#0d0d14;--panel:#151521;--line:#2b2b3d;--text:#f5f3fa;--muted:#a8a4b8;--accent:#dca7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#27203a 0,#0d0d14 42%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#dca7ff,#8edcff);color:#181321;font-size:22px;box-shadow:0 10px 30px #0005}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0 0;color:var(--muted)}button,select,input,textarea{font:inherit}.btn{border:1px solid var(--line);background:#1d1d2a;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:#77728f}.primary{background:linear-gradient(135deg,#c992ff,#83d8ff);color:#15111c;border:0;font-weight:700}.layout{display:grid;grid-template-columns:440px 1fr;gap:16px}.panel{background:#12121cdd;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #0005}.controls{padding:16px;max-height:calc(100vh - 95px);overflow:auto}.section{padding:4px 0 18px;border-bottom:1px solid #292938;margin-bottom:16px}.section:last-child{border-bottom:0}.st{display:flex;gap:10px;align-items:center;margin-bottom:12px}.st b{color:var(--accent);font-size:12px}.st h2{font-size:15px;margin:0}.drop{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed #4a475d;border-radius:12px;cursor:pointer;background:#191925;margin-bottom:8px}.drop input{display:none}.drop strong{min-width:100px}.drop small{color:var(--muted)}.drop .count{margin-left:auto;color:var(--accent)}.row{display:flex;gap:8px;align-items:center}.gallery{display:flex;flex-direction:column;gap:7px;margin-top:10px}.item{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;background:#191925;border:1px solid #2c2c3d;padding:7px;border-radius:10px}.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#252536}.item small{display:block;color:var(--muted)}.item input[type=number]{width:70px;background:#10101a;border:1px solid var(--line);color:white;border-radius:7px;padding:5px}.mini{padding:5px 7px;font-size:12px}.cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cover-preset{min-height:72px;border:1px solid #303044;background:linear-gradient(145deg,#1b1b29,#151521);color:#fff;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:24px;transition:.18s transform,.18s border-color,.18s box-shadow}.cover-preset span{font-size:11px;color:#c8c3d5}.cover-preset:hover{transform:translateY(-2px);border-color:#b98be6;box-shadow:0 8px 22px #0005}.cover-preset.active{border-color:#dca7ff;box-shadow:0 0 0 2px #dca7ff33 inset}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{background:#191925;border:1px solid var(--line);padding:8px;border-radius:9px}.slider{margin:11px 0}.slider span{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:6px}.slider input{width:100%}.export textarea{width:100%;height:120px;background:#0b0b12;color:#cfc9df;border:1px solid var(--line);border-radius:10px;padding:9px;resize:vertical}.export-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}.preview{min-height:700px;display:flex;flex-direction:column}.bar{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted)}.stage{flex:1;display:grid;place-items:center;padding:35px;background:radial-gradient(circle at 50% 35%,#30263d 0,#11111a 48%,#0d0d14 100%)}.empty{text-align:center;color:var(--muted)}.empty b{font-size:50px;display:block;margin-bottom:10px}.tip{padding:10px 15px;color:#aaa6b7;border-top:1px solid var(--line);font-size:12px}
/* ===== 실제 호버 작품: 공통 프레임이 아니라 테마별 작품 자체 ===== */
.work{width:min(520px,90%);aspect-ratio:4/5;position:relative;cursor:pointer;filter:drop-shadow(0 25px 45px #0009);perspective:1200px}.art{position:absolute;inset:0;border-radius:28px;overflow:hidden;isolation:isolate}.art:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff35,inset 0 0 80px #0002}.paper{position:absolute;inset:7%;border-radius:18px;overflow:hidden;z-index:3;box-shadow:0 18px 45px #0003;transition:transform .65s cubic-bezier(.2,.8,.2,1),box-shadow .65s}.photo-wrap{position:absolute;z-index:5;left:50%;top:51%;width:58%;aspect-ratio:1/1.08;transform:translate(-50%,-45%) scale(.72) rotate(-3deg);opacity:0;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1);padding:9px;background:#fff;box-shadow:0 18px 35px #0005}.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}.work.open .photo-wrap{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}.work.open .paper{transform:scale(.985);box-shadow:0 25px 55px #0004}.art-title{position:absolute;z-index:4;left:12%;right:12%;top:13%;text-align:center;font:700 25px/1.2 Georgia,"Noto Serif KR",serif}.art-kicker{position:absolute;z-index:4;left:12%;right:12%;top:8%;text-align:center;font:700 9px/1 system-ui;letter-spacing:3px;opacity:.7}.art-sub{position:absolute;z-index:4;left:12%;right:12%;bottom:9%;text-align:center;font:13px/1.6 Georgia,"Noto Serif KR",serif;opacity:.75}.photo-label{position:absolute;z-index:7;left:50%;top:51%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:2px;color:#777;opacity:.7;transition:opacity .35s}.work.open .photo-label{opacity:0}.decor{position:absolute;z-index:2;inset:0;pointer-events:none}.spark{position:absolute;animation:float 3s ease-in-out infinite}.leaf{position:absolute}.line{position:absolute}.petal{position:absolute;animation:fall 4s ease-in-out infinite}.moon-shape{position:absolute;border-radius:50%}.ribbon-shape{position:absolute}.wing{position:absolute}.star{position:absolute}.flower{position:absolute}.note{position:absolute}.gem{position:absolute}.box{position:absolute}.stamp{position:absolute}.film{position:absolute}@keyframes float{50%{transform:translateY(-7px) rotate(4deg)}}@keyframes fall{50%{transform:translate(7px,13px) rotate(20deg)}}
/* LOVE */.love.art{background:linear-gradient(145deg,#f7cfdc,#df9eb9 52%,#9e668d)}.love .paper{background:#fff9f5;border:1px solid #d8a2b8}.love .paper:before{content:"";position:absolute;inset:7%;border:1px solid #edcfda;border-radius:10px}.love .art-title{color:#633f52}.love .photo-wrap{border:8px solid #fff}.love .art-sub{color:#633f52}.love .ribbon-shape{width:110px;height:45px;left:50%;top:3%;transform:translateX(-50%);border-radius:6px;background:#d58aa7}.love .ribbon-shape:before,.love .ribbon-shape:after{content:"";position:absolute;width:60px;height:45px;background:#c9799b;top:0}.love .ribbon-shape:before{right:75%;clip-path:polygon(100% 0,0 50%,100% 100%)}.love .ribbon-shape:after{left:75%;clip-path:polygon(0 0,100% 50%,0 100%)}
/* CHERRY */.cherry.art{background:linear-gradient(160deg,#fff0f6,#f6bfd2 55%,#d98ca8)}.cherry .paper{background:linear-gradient(#fffdfd,#fff5f9);border:1px solid #e5bfd0}.cherry .art-title{color:#6f4b5b}.cherry .photo-wrap{border:7px solid #f0d4df}.cherry .art-sub{color:#765363}.cherry .line{right:-5%;top:5%;width:75%;height:90px;border-top:10px solid #684c48;border-radius:50%;transform:rotate(-17deg)}.cherry .flower{color:#e48bab;font-size:34px}.cherry .f1{right:8%;top:7%}.cherry .f2{right:26%;top:15%}.cherry .f3{left:8%;bottom:14%}.cherry .petal{color:#e58aa9;font-size:25px}.cherry .p1{left:10%;top:28%}.cherry .p2{right:8%;top:33%}.cherry .p3{left:18%;bottom:8%}
/* MOON */.moon.art{background:radial-gradient(circle at 70% 18%,#7180c8,#252c61 42%,#0b1030)}.moon .paper{background:linear-gradient(160deg,#edf2ff,#dbe4ff);border:1px solid #a8b9e0}.moon .art-title{color:#28355e}.moon .photo-wrap{border:6px solid #fff}.moon .art-sub{color:#33416b}.moon-shape{right:12%;top:9%;width:88px;height:88px;background:#fff2b7;box-shadow:0 0 45px #fff2b7aa}.moon-shape:after{content:"";position:absolute;right:-17px;top:-7px;width:80px;height:80px;border-radius:50%;background:#596ab4}.moon .star{color:#fff5b6;font-size:22px}.moon .s1{left:10%;top:18%}.moon .s2{right:15%;top:30%}.moon .s3{left:12%;bottom:18%}.moon .line{left:-10%;bottom:12%;width:120%;height:80px;border-top:20px solid #9aa9d1;border-radius:50%;opacity:.5}
/* RIBBON */.ribbon.art{background:linear-gradient(145deg,#f3c2d5,#bc6f99)}.ribbon .paper{background:#fff8fc;border:1px solid #e5afca}.ribbon .art-title{color:#6c3652}.ribbon .photo-wrap{border:7px solid #f1c6d9}.ribbon-shape.big{left:50%;top:5%;width:135px;height:135px;transform:translateX(-50%);background:#d988ad;border-radius:8px;box-shadow:0 12px 25px #0002}.ribbon-shape.big:before{content:"";position:absolute;left:58px;top:0;width:20px;height:135px;background:#f4d0df}.ribbon-shape.big:after{content:"";position:absolute;left:0;top:57px;width:135px;height:20px;background:#f4d0df}.ribbon .art-sub{color:#75435b}
/* ANGEL */.angel.art{background:linear-gradient(150deg,#e8f3f8,#b9c9ea 50%,#8b87bd)}.angel .paper{background:rgba(255,255,255,.88);border:1px solid #c8d8e7}.angel .art-title{color:#53627e}.angel .photo-wrap{border:7px solid #eef6ff}.halo{position:absolute;left:50%;top:8%;width:90px;height:35px;transform:translateX(-50%);border:5px solid #fff8d9;border-radius:50%;box-shadow:0 0 25px #fff8d9}.wing{top:11%;width:120px;height:180px;background:linear-gradient(135deg,#fff,#dce8f7);border-radius:75% 25% 70% 30%;opacity:.85}.wing.left{left:2%;transform:rotate(18deg)}.wing.right{right:2%;transform:scaleX(-1) rotate(18deg)}.angel .art-sub{color:#5b6881}
/* AURORA */.aurora.art{background:linear-gradient(160deg,#102b4b,#1d5262 45%,#6e4b91)}.aurora .paper{background:rgba(250,255,252,.9);border:1px solid #c9f3ea}.aurora .art-title{color:#355d66}.aurora .photo-wrap{border:7px solid #e6fffa}.aurora .line{left:-20%;top:20%;width:140%;height:170px;border-radius:50%;border-top:28px solid #8cf1d9aa;transform:rotate(-8deg);box-shadow:0 -25px 0 #9d8df566,0 -50px 0 #70d9e244}.aurora .star{color:#fff;font-size:25px}.aurora .s1{right:10%;top:12%}.aurora .s2{left:9%;bottom:20%}.aurora .art-sub{color:#46696b}
/* CRYSTAL */.crystal.art{background:linear-gradient(145deg,#b9e9ff,#7aa8e2 50%,#6c5da4)}.crystal .paper{background:linear-gradient(150deg,#f9ffff,#edf2ff);border:1px solid #c9d9f0}.crystal .art-title{color:#3f587c}.crystal .photo-wrap{border:7px solid #fff}.gem{width:60px;height:75px;background:linear-gradient(135deg,#fff,#8ddcff,#6c7ff2);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);filter:drop-shadow(0 12px 14px #263d6c66)}.crystal .g1{left:8%;top:9%}.crystal .g2{right:7%;top:17%;transform:scale(.65) rotate(20deg)}.crystal .g3{right:10%;bottom:10%;transform:scale(.45) rotate(-15deg)}.crystal .art-sub{color:#526784}
/* BUTTERFLY */.butterfly.art{background:linear-gradient(145deg,#dbc8f1,#9e91d6 50%,#6f7bc1)}.butterfly .paper{background:#fffafd;border:1px solid #d5c6ed}.butterfly .art-title{color:#5b4c7d}.butterfly .photo-wrap{border:7px solid #fff}.butterfly .spark{font-size:42px}.butterfly .s1{left:7%;top:12%}.butterfly .s2{right:8%;bottom:16%}.butterfly .but{position:absolute;font-size:55px}.butterfly .b1{right:7%;top:7%;animation:float 3s infinite}.butterfly .b2{left:7%;bottom:11%;font-size:35px;animation:float 4s infinite}
/* GARDEN */.garden.art{background:linear-gradient(180deg,#f2f8ec,#b9d7bf 55%,#8eaf9a)}.garden .paper{background:#fffef8;border:1px solid #cddfc9}.garden .art-title{color:#496553}.garden .photo-wrap{border:7px solid #fff}.garden .flower{font-size:38px;color:#e2a4b8}.garden .f1{left:7%;top:12%}.garden .f2{right:8%;top:18%;color:#c995b1}.garden .f3{right:8%;bottom:12%;color:#e8b0c2}.garden .leaf{font-size:32px;color:#6f9a76}.garden .l1{left:10%;bottom:18%}.garden .l2{right:14%;bottom:21%}.garden .art-sub{color:#5b725f}
/* VINTAGE */.vintage.art{background:linear-gradient(145deg,#b99a72,#72533f)}.vintage .paper{background:#ead8b8;border:1px solid #a8845e;box-shadow:0 18px 45px #3d2b1d66}.vintage .art-title{color:#624733}.vintage .photo-wrap{border:9px solid #f2e4c9;box-shadow:0 18px 35px #4a382a66}.vintage .stamp{left:9%;top:8%;padding:7px;border:2px solid #9b664f;color:#8a5d4b;transform:rotate(-10deg);font:700 9px system-ui}.vintage .line{left:12%;right:12%;bottom:20%;height:1px;background:#b99872;box-shadow:0 13px #b99872,0 26px #b99872}.vintage .art-sub{color:#74563d}
/* ROYAL */.royal.art{background:radial-gradient(circle at 50% 20%,#b99ad9,#5b427d 48%,#2d2146)}.royal .paper{background:linear-gradient(145deg,#fbf4ff,#e9dcf1);border:2px solid #d3ad55}.royal .art-title{color:#5a3d73}.royal .photo-wrap{border:8px solid #d9b65d}.royal .crown{position:absolute;left:50%;top:4%;transform:translateX(-50%);font-size:72px;color:#e2c56b;text-shadow:0 5px 15px #4c3b4d55}.royal .gem{transform:scale(.35);right:-5%;bottom:8%}.royal .art-sub{color:#70517e}
/* SWEET */.sweet.art{background:linear-gradient(145deg,#ffd5c8,#f2a5c2 55%,#c57daa)}.sweet .paper{background:#fff9f6;border:1px solid #f0bdc8}.sweet .art-title{color:#9b5e70}.sweet .photo-wrap{border:8px solid #fff}.sweet .box{left:50%;top:7%;transform:translateX(-50%);font-size:58px}.sweet .spark{font-size:26px;color:#e59aae}.sweet .s1{left:9%;top:14%}.sweet .s2{right:9%;top:20%}.sweet .art-sub{color:#9b6371}
/* MUSIC */.music.art{background:linear-gradient(145deg,#b8caeb,#7b88b7 55%,#555d86)}.music .paper{background:#fbfcff;border:1px solid #c2cee7}.music .art-title{color:#4e5d82}.music .photo-wrap{border:7px solid #fff}.music .line{left:10%;right:10%;top:23%;height:55px;border-top:2px solid #7180a5;border-bottom:2px solid #7180a5;box-shadow:0 17px #7180a5,0 34px #7180a5}.music .note{font-size:45px;color:#5d6b92}.music .n1{left:12%;top:14%}.music .n2{right:13%;top:22%}.music .n3{left:10%;bottom:13%}.music .art-sub{color:#627091}
/* MAGIC */.magic.art{background:radial-gradient(circle,#594c9b,#27235e 52%,#100e2c)}.magic .paper{background:rgba(249,245,255,.94);border:1px solid #d8caff}.magic .art-title{color:#55428b}.magic .photo-wrap{border:7px solid #fff}.magic .line{left:50%;top:48%;width:230px;height:230px;transform:translate(-50%,-50%);border:2px dashed #a786e8;border-radius:50%;box-shadow:0 0 0 15px #d8c7ff22,0 0 35px #9f7df455}.magic .spark{font-size:30px;color:#fff}.magic .s1{left:10%;top:15%}.magic .s2{right:9%;bottom:18%}.magic .art-sub{color:#66538e}
/* POLAROID */.polaroid.art{background:linear-gradient(145deg,#d5d0c8,#8f8b84)}.polaroid .paper{background:#f8f7f2;border:1px solid #d6d1c8;transform:rotate(-1deg)}.polaroid .art-title{color:#4e4a45}.polaroid .photo-wrap{width:62%;background:#f8f7f2;padding:10px 10px 46px;border:0;transform:translate(-50%,-45%) rotate(-2deg) scale(.72)}.polaroid .work-open{} .polaroid .art-sub{color:#5e5951}.polaroid .stamp{right:8%;top:8%;font:700 9px system-ui;color:#777;transform:rotate(9deg)}.polaroid .film{left:0;right:0;bottom:0;height:30px;background:repeating-linear-gradient(90deg,#222 0 12px,#eee 12px 20px)}
/* interactions */.shine{position:absolute;inset:-60%;z-index:20;pointer-events:none;background:linear-gradient(110deg,transparent 38%,#fff8 48%,transparent 58%);transform:translateX(-60%) rotate(12deg);transition:transform .9s}.work:hover .shine{transform:translateX(60%) rotate(12deg)}.particle{position:absolute;inset:0;z-index:21;pointer-events:none}.particle i{position:absolute;opacity:0;animation:rise 2.6s linear infinite}.work.open .particle i{opacity:.8}@keyframes rise{10%{opacity:.8}100%{transform:translate(var(--x),-120px) rotate(35deg);opacity:0}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.controls{max-height:none}.preview{min-height:620px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">✦</div><div><h1>호버방셀 제작기</h1><p>표지가 아니라, 테마별 작품 안에서 사진이 나타나는 방식</p></div></div></header>
<div class="layout"><aside class="panel controls">
<section class="section"><div class="st"><b>01</b><h2>사진</h2></div><label class="drop"><input id="photos" type="file" accept="image/*" multiple><strong>🖼 사진 추가</strong><small>작품 안에 들어갈 사진</small><span class="count" id="count">0장</span></label><div class="gallery" id="gallery"></div><div class="row" style="margin-top:8px"><button class="btn" id="addDemo">＋ 샘플 사진 4장</button><button class="btn" id="clearPhotos">전체 삭제</button></div></section>
<section class="section"><div class="st"><b>02</b><h2>작품 테마</h2></div><div class="cover-grid">
<button class="cover-preset" data-theme="love">💌<span>러브레터</span></button><button class="cover-preset" data-theme="cherry">🌸<span>벚꽃</span></button><button class="cover-preset" data-theme="moon">🌙<span>달빛</span></button><button class="cover-preset" data-theme="ribbon">🎀<span>리본</span></button><button class="cover-preset" data-theme="angel">🪽<span>엔젤</span></button><button class="cover-preset" data-theme="aurora">🫧<span>오로라</span></button><button class="cover-preset" data-theme="crystal">💎<span>크리스탈</span></button><button class="cover-preset" data-theme="butterfly">🦋<span>버터플라이</span></button><button class="cover-preset" data-theme="garden">🌿<span>화이트 가든</span></button><button class="cover-preset" data-theme="vintage">✉️<span>빈티지</span></button><button class="cover-preset" data-theme="royal">👑<span>로열</span></button><button class="cover-preset" data-theme="sweet">🍰<span>스위트</span></button><button class="cover-preset" data-theme="music">🎼<span>뮤직</span></button><button class="cover-preset" data-theme="magic">🪄<span>매직</span></button><button class="cover-preset" data-theme="polaroid">📷<span>폴라로이드</span></button>
</div><div class="row" style="margin-top:8px"><button class="btn" id="randomTheme">🎲 랜덤 테마</button><button class="btn" id="clearTheme">테마 초기화</button></div></section>
<section class="section"><div class="st"><b>03</b><h2>호버 효과</h2></div><label class="field"><span>사진 등장 방식</span><select id="transition"><option value="fade">부드럽게 등장</option><option value="zoom">확대되며 등장</option><option value="flip">종이처럼 뒤집기</option></select></label><div class="checks"><label class="check"><input id="autoplay" type="checkbox" checked> 사진 자동 전환</label><label class="check"><input id="float" type="checkbox" checked> 살짝 떠있기</label><label class="check"><input id="shine" type="checkbox" checked> 빛 스치기</label><label class="check"><input id="glow" type="checkbox" checked> 테마 광택</label><label class="check"><input id="tilt" type="checkbox" checked> 마우스 기울기</label><label class="check"><input id="particles" type="checkbox" checked> 장식 효과</label></div><label class="slider"><span><b>사진 전환</b><b id="durationV">1.8초</b></span><input id="duration" type="range" min="500" max="6000" step="100" value="1800"></label><label class="slider"><span><b>모서리</b><b id="radiusV">22px</b></span><input id="radius" type="range" min="0" max="40" value="22"></label></section>
<section class="section export"><div class="st"><b>04</b><h2>내보내기</h2></div><div class="export-actions"><button class="btn primary" id="copy">HTML 복사</button><button class="btn" id="download">HTML 저장</button><button class="btn" id="iframe">iframe 코드</button></div><textarea id="output" readonly placeholder="테마와 사진을 선택하면 완성된 HTML이 생성돼."></textarea></section>
</aside><section class="panel preview"><div class="bar"><b>LIVE PREVIEW</b><span>PC: 마우스 올리기 · 모바일: 터치</span></div><div class="stage" id="stage"><div class="empty" id="empty"><b>💌</b><div>테마와 사진을 선택해보세요</div></div><div id="mount" hidden></div></div><div class="tip">TIP · 이제 앞면에 똑같은 표지 이미지를 깔지 않아. 선택한 테마의 편지지/작품 자체가 보이고, 마우스를 올리면 그 안에서 사진이 나타나.</div></section></div></div>
<script>
const $=s=>document.querySelector(s);const state={theme:'love',photos:[],settings:{transition:'fade',autoplay:true,float:true,shine:true,glow:true,tilt:true,particles:true,duration:1800,radius:22}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function svgData(label,a,b){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="1000" fill="url(#g)"/><circle cx="120" cy="160" r="110" fill="#fff3"/><circle cx="690" cy="760" r="180" fill="#fff2"/><text x="400" y="470" text-anchor="middle" fill="white" font-size="64" font-family="sans-serif">${label}</text><text x="400" y="535" text-anchor="middle" fill="#fff9" font-size="28" font-family="sans-serif">MEMORY</text></svg>`)}
const themes={
 love:{cls:'love',title:'오늘도 너에게',kicker:'A LETTER FOR YOU',sub:'보고 싶은 마음을 한 장에 담았어',decor:'<div class="ribbon-shape"></div><div class="spark" style="left:8%;bottom:16%;font-size:28px">♡</div><div class="spark" style="right:8%;bottom:23%;font-size:22px">♥</div>'},
 cherry:{cls:'cherry',title:'벚꽃이 피던 날',kicker:'SPRING MEMORY',sub:'꽃잎처럼 예쁜 순간을 담았어',decor:'<div class="line"></div><div class="flower f1">✿</div><div class="flower f2">✿</div><div class="flower f3">❀</div><div class="petal p1">✿</div><div class="petal p2">✿</div><div class="petal p3">✿</div>'},
 moon:{cls:'moon',title:'달빛 아래 우리',kicker:'MOONLIGHT LETTER',sub:'같은 달을 바라보며 기억할게',decor:'<div class="moon-shape"></div><div class="star s1">✦</div><div class="star s2">✧</div><div class="star s3">✦</div><div class="line"></div>'},
 ribbon:{cls:'ribbon',title:'너를 위한 선물',kicker:'A LITTLE GIFT',sub:'리본을 풀면 작은 추억이 나와',decor:'<div class="ribbon-shape big"></div><div class="spark" style="left:7%;bottom:18%;font-size:24px">✦</div>'},
 angel:{cls:'angel',title:'천사의 편지',kicker:'MY LITTLE MIRACLE',sub:'소중한 너에게 보내는 작은 기적',decor:'<div class="halo"></div><div class="wing left"></div><div class="wing right"></div>'},
 aurora:{cls:'aurora',title:'오로라의 기억',kicker:'DREAMY NIGHT',sub:'꿈처럼 빛나던 순간을 담았어',decor:'<div class="line"></div><div class="star s1">✦</div><div class="star s2">✧</div>'},
 crystal:{cls:'crystal',title:'반짝이는 순간',kicker:'CRYSTAL MEMORY',sub:'작은 빛도 오래 간직할게',decor:'<div class="gem g1"></div><div class="gem g2"></div><div class="gem g3"></div>'},
 butterfly:{cls:'butterfly',title:'나비처럼 날아온 기억',kicker:'FREE LIKE A BUTTERFLY',sub:'가볍게, 예쁘게, 오래 남도록',decor:'<div class="but b1">🦋</div><div class="but b2">🦋</div><div class="spark s1">✦</div><div class="spark s2">✧</div>'},
 garden:{cls:'garden',title:'하얀 정원의 편지',kicker:'WHITE GARDEN',sub:'따뜻한 오후의 꽃향기를 담아',decor:'<div class="flower f1">✿</div><div class="flower f2">❀</div><div class="flower f3">✿</div><div class="leaf l1">❧</div><div class="leaf l2">❧</div>'},
 vintage:{cls:'vintage',title:'오래된 편지',kicker:'DEAR YOU',sub:'시간이 지나도 남아 있을 이야기',decor:'<div class="stamp">AIR<br>AIRMAIL</div><div class="line"></div>'},
 royal:{cls:'royal',title:'나만의 작은 왕실',kicker:'A SPECIAL MEMORY',sub:'오늘만큼은 너를 가장 귀하게',decor:'<div class="crown">♕</div><div class="gem" style="right:0;bottom:7%"></div>'},
 sweet:{cls:'sweet',title:'달콤한 하루',kicker:'SWEET DAY',sub:'웃음 한 조각, 행복 한 스푼',decor:'<div class="box">🍰</div><div class="spark s1">✦</div><div class="spark s2">♥</div>'},
 music:{cls:'music',title:'우리의 멜로디',kicker:'OUR LITTLE MELODY',sub:'기억 속에 계속 흐르는 노래처럼',decor:'<div class="line"></div><div class="note n1">♪</div><div class="note n2">♫</div><div class="note n3">♩</div>'},
 magic:{cls:'magic',title:'마법처럼 열린 기억',kicker:'A LITTLE MAGIC',sub:'소원을 빌고 사진을 열어봐',decor:'<div class="line"></div><div class="spark s1">✧</div><div class="spark s2">✦</div>'},
 polaroid:{cls:'polaroid',title:'찰칵, 그 순간',kicker:'ONE MOMENT FOREVER',sub:'사진 한 장에 오래 남겨둘게',decor:'<div class="stamp">MEMORY</div><div class="film"></div>'}
};
function settingsFromUI(){state.settings={transition:$('#transition').value,autoplay:$('#autoplay').checked,float:$('#float').checked,shine:$('#shine').checked,glow:$('#glow').checked,tilt:$('#tilt').checked,particles:$('#particles').checked,duration:+$('#duration').value,radius:+$('#radius').value};$('#durationV').textContent=(state.settings.duration/1000).toFixed(1)+'초';$('#radiusV').textContent=state.settings.radius+'px'}
function particle(){if(!state.settings.particles)return '';return '<div class="particle">'+Array.from({length:12},(_,i)=>`<i style="left:${8+i*7}%;top:${58+(i%4)*7}%;--x:${-40+i*8}px;animation-delay:${i*100}ms">${['✦','♥','✿','·'][i%4]}</i>`).join('')+'</div>'}
function photoMarkup(p){return p?`<div class="photo-wrap"><img src="${esc(p.url)}" alt=""></div><div class="photo-label">HOVER TO REVEAL</div>`:''}
function render(){settingsFromUI();const empty=$('#empty'),m=$('#mount');empty.hidden=!!(state.theme&&state.photos.length);m.hidden=empty.hidden;if(!state.theme||!state.photos.length){m.innerHTML='';return}const t=themes[state.theme];const p=state.photos[0];m.innerHTML=`<div class="work ${state.settings.float?'float':''} ${state.settings.glow?'glow':''}" style="--radius:${state.settings.radius}px"><div class="art ${t.cls}"><div class="paper"></div><div class="decor">${t.decor}</div><div class="art-kicker">${t.kicker}</div><div class="art-title">${t.title}</div>${photoMarkup(p)}<div class="art-sub">${t.sub}</div>${state.settings.shine?'<div class="shine"></div>':''}${particle()}</div></div>`;const w=m.querySelector('.work');let idx=0,timer;function show(){w.classList.add('open')}function hide(){w.classList.remove('open')}w.addEventListener('mouseenter',show);w.addEventListener('mouseleave',hide);w.addEventListener('touchstart',()=>w.classList.toggle('open'),{passive:true});if(state.settings.tilt){w.addEventListener('mousemove',e=>{const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;w.style.transform=`rotateX(${y*-5}deg) rotateY(${x*7}deg)`});w.addEventListener('mouseleave',()=>w.style.transform='')}function next(){if(state.photos.length<2)return;idx=(idx+1)%state.photos.length;const wrap=m.querySelector('.photo-wrap');if(wrap){wrap.querySelector('img').src=state.photos[idx].url}if(state.settings.autoplay)timer=setTimeout(next,state.photos[idx].duration||state.settings.duration)}if(state.settings.autoplay&&state.photos.length>1)timer=setTimeout(next,state.photos[0].duration||state.settings.duration)}
function addPhoto(url,name='사진'){state.photos.push({url,name,duration:state.settings.duration});renderGallery();render()}
function renderGallery(){const g=$('#gallery');g.innerHTML='';$('#count').textContent=state.photos.length+'장';state.photos.forEach((p,i)=>{const d=document.createElement('div');d.className='item';d.draggable=true;d.dataset.i=i;d.innerHTML=`<img class="thumb" src="${p.url}"><div><b>${i+1}. ${esc(p.name)}</b><small>표시시간 <input type="number" min="0.5" max="10" step="0.1" value="${(p.duration/1000).toFixed(1)}"> 초</small></div><button class="btn mini">✕</button>`;d.querySelector('input').oninput=e=>{p.duration=Math.max(500,+e.target.value*1000);settingsFromUI();render()};d.querySelector('button').onclick=()=>{state.photos.splice(i,1);renderGallery();render()};d.ondragstart=e=>e.dataTransfer.setData('text/plain',i);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain');if(from!==i){const[x]=state.photos.splice(from,1);state.photos.splice(i,0,x);renderGallery();render()}};g.appendChild(d)})}
const themeKeys=Object.keys(themes);document.querySelectorAll('.cover-preset').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;document.querySelectorAll('.cover-preset').forEach(x=>x.classList.toggle('active',x===b));render()});$('#randomTheme').onclick=()=>{state.theme=themeKeys[Math.floor(Math.random()*themeKeys.length)];document.querySelectorAll('.cover-preset').forEach(x=>x.classList.toggle('active',x.dataset.theme===state.theme));render()};$('#clearTheme').onclick=()=>{state.theme=null;document.querySelectorAll('.cover-preset').forEach(x=>x.classList.remove('active'));render()};$('#photos').onchange=async e=>{for(const f of e.target.files)addPhoto(await readFile(f),f.name);e.target.value=''};$('#clearPhotos').onclick=()=>{state.photos=[];renderGallery();render()};$('#addDemo').onclick=()=>{const sets=[['Dream','#d98ab8','#7750a8'],['Moon','#4e68ad','#161a38'],['Bloom','#9ed5b7','#5f76c8'],['Letter','#d9b98b','#72544c']];state.photos=sets.map(x=>({url:svgData(x[0],x[1],x[2]),name:x[0],duration:state.settings.duration}));renderGallery();render()};['transition','autoplay','float','shine','glow','tilt','particles','duration','radius'].forEach(id=>$('#'+id).addEventListener('input',render));
function buildExport(){if(!state.theme||!state.photos.length)return '<!-- 테마와 사진을 먼저 선택해주세요 -->';const s=JSON.stringify({theme:state.theme,photos:state.photos,settings:state.settings}),t=JSON.stringify(themes);return `<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:transparent}.work{width:min(420px,90vw);aspect-ratio:4/5;position:relative;cursor:pointer;filter:drop-shadow(0 25px 45px #0009)}.art{position:absolute;inset:0;border-radius:${state.settings.radius}px;overflow:hidden;isolation:isolate}.paper{position:absolute;inset:7%;border-radius:18px;overflow:hidden;z-index:3}.photo-wrap{position:absolute;z-index:5;left:50%;top:51%;width:58%;aspect-ratio:1/1.08;transform:translate(-50%,-45%) scale(.72) rotate(-3deg);opacity:0;transition:opacity .5s,transform .7s;padding:9px;background:#fff;box-shadow:0 18px 35px #0005}.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}.work.open .photo-wrap{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}.art-title{position:absolute;z-index:4;left:12%;right:12%;top:13%;text-align:center;font:700 25px/1.2 Georgia,serif}.art-kicker{position:absolute;z-index:4;left:12%;right:12%;top:8%;text-align:center;font:700 9px system-ui;letter-spacing:3px;opacity:.7}.art-sub{position:absolute;z-index:4;left:12%;right:12%;bottom:9%;text-align:center;font:13px/1.6 Georgia,serif;opacity:.75}.decor{position:absolute;z-index:2;inset:0;pointer-events:none}.spark,.flower,.star,.note,.gem,.box,.stamp,.film,.line,.moon-shape,.ribbon-shape,.wing,.petal,.but{position:absolute}.love.art{background:linear-gradient(145deg,#f7cfdc,#df9eb9 52%,#9e668d)}.love .paper{background:#fff9f5;border:1px solid #d8a2b8}.love .art-title{color:#633f52}.love .photo-wrap{border:8px solid #fff}.cherry.art{background:linear-gradient(160deg,#fff0f6,#f6bfd2 55%,#d98ca8)}.cherry .paper{background:#fffdfd;border:1px solid #e5bfd0}.cherry .art-title{color:#6f4b5b}.cherry .photo-wrap{border:7px solid #f0d4df}.moon.art{background:radial-gradient(circle at 70% 18%,#7180c8,#252c61 42%,#0b1030)}.moon .paper{background:#edf2ff;border:1px solid #a8b9e0}.moon .art-title{color:#28355e}.moon .photo-wrap{border:6px solid #fff}.ribbon.art{background:linear-gradient(145deg,#f3c2d5,#bc6f99)}.ribbon .paper{background:#fff8fc;border:1px solid #e5afca}.ribbon .art-title{color:#6c3652}.ribbon .photo-wrap{border:7px solid #f1c6d9}.angel.art{background:linear-gradient(150deg,#e8f3f8,#b9c9ea 50%,#8b87bd)}.angel .paper{background:#ffffffe6;border:1px solid #c8d8e7}.angel .art-title{color:#53627e}.angel .photo-wrap{border:7px solid #eef6ff}.aurora.art{background:linear-gradient(160deg,#102b4b,#1d5262 45%,#6e4b91)}.aurora .paper{background:#faffffe8;border:1px solid #c9f3ea}.aurora .art-title{color:#355d66}.aurora .photo-wrap{border:7px solid #e6fffa}.crystal.art{background:linear-gradient(145deg,#b9e9ff,#7aa8e2 50%,#6c5da4)}.crystal .paper{background:#f9ffff;border:1px solid #c9d9f0}.crystal .art-title{color:#3f587c}.crystal .photo-wrap{border:7px solid #fff}.butterfly.art{background:linear-gradient(145deg,#dbc8f1,#9e91d6 50%,#6f7bc1)}.butterfly .paper{background:#fffafd;border:1px solid #d5c6ed}.butterfly .art-title{color:#5b4c7d}.butterfly .photo-wrap{border:7px solid #fff}.garden.art{background:linear-gradient(180deg,#f2f8ec,#b9d7bf 55%,#8eaf9a)}.garden .paper{background:#fffef8;border:1px solid #cddfc9}.garden .art-title{color:#496553}.garden .photo-wrap{border:7px solid #fff}.vintage.art{background:linear-gradient(145deg,#b99a72,#72533f)}.vintage .paper{background:#ead8b8;border:1px solid #a8845e}.vintage .art-title{color:#624733}.vintage .photo-wrap{border:9px solid #f2e4c9}.royal.art{background:radial-gradient(circle at 50% 20%,#b99ad9,#5b427d 48%,#2d2146)}.royal .paper{background:#fbf4ff;border:2px solid #d3ad55}.royal .art-title{color:#5a3d73}.royal .photo-wrap{border:8px solid #d9b65d}.sweet.art{background:linear-gradient(145deg,#ffd5c8,#f2a5c2 55%,#c57daa)}.sweet .paper{background:#fff9f6;border:1px solid #f0bdc8}.sweet .art-title{color:#9b5e70}.sweet .photo-wrap{border:8px solid #fff}.music.art{background:linear-gradient(145deg,#b8caeb,#7b88b7 55%,#555d86)}.music .paper{background:#fbfcff;border:1px solid #c2cee7}.music .art-title{color:#4e5d82}.music .photo-wrap{border:7px solid #fff}.magic.art{background:radial-gradient(circle,#594c9b,#27235e 52%,#100e2c)}.magic .paper{background:#f9f5ffef;border:1px solid #d8caff}.magic .art-title{color:#55428b}.magic .photo-wrap{border:7px solid #fff}.polaroid.art{background:linear-gradient(145deg,#d5d0c8,#8f8b84)}.polaroid .paper{background:#f8f7f2;border:1px solid #d6d1c8;transform:rotate(-1deg)}.polaroid .art-title{color:#4e4a45}.polaroid .photo-wrap{width:62%;background:#f8f7f2;padding:10px 10px 46px;border:0}.work.open .photo-wrap{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}</style><div class="work" id="w"><div class="art ${themes[state.theme].cls}"><div class="paper"></div><div class="decor">${themes[state.theme].decor}</div><div class="art-kicker">${themes[state.theme].kicker}</div><div class="art-title">${themes[state.theme].title}</div><div class="photo-wrap"><img id="pic" src="${state.photos[0].url}"></div><div class="art-sub">${themes[state.theme].sub}</div></div></div><script>(function(){const a=${s},T=${t};let i=0;const w=document.getElementById('w'),pic=document.getElementById('pic');function open(){w.classList.add('open')}function close(){w.classList.remove('open')}w.onmouseenter=open;w.onmouseleave=close;w.ontouchstart=()=>w.classList.toggle('open');${state.settings.autoplay&&state.photos.length>1?'setInterval(()=>{i=(i+1)%a.photos.length;pic.src=a.photos[i].url},'+state.settings.duration+')':''}})()<\/script></html>`}
$('#copy').onclick=async()=>{const h=buildExport();$('#output').value=h;try{await navigator.clipboard.writeText(h);alert('HTML을 복사했어.')}catch(e){alert('아래 출력창의 HTML을 직접 복사해줘.')}};$('#download').onclick=()=>{const h=buildExport();$('#output').value=h;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='hovercell-theme.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#iframe').onclick=()=>{const h=buildExport();const blob=URL.createObjectURL(new Blob([h],{type:'text/html'}));const code=`<iframe src="${blob}" width="420" height="525" style="border:0;max-width:100%" loading="lazy"></iframe>`;$('#output').value=code};
settingsFromUI();document.querySelector('[data-theme="love"]').classList.add('active');renderGallery();render();
</script></body></html>
