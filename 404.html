<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>+구구+ 팬 홈페이지</title>
<script>
  // GitHub Pages는 index.html 말고 다른 주소(/board/xxx 같은)로 직접 들어오거나
  // 새로고침하면 이 404 페이지를 보여줘요. 그래서 여기서 원래 가려던 주소를
  // 잠깐 기억해뒀다가 index.html로 돌려보내고, index.html이 열리자마자
  // 다시 그 주소로 돌아가게 해요 (index.html 맨 위 스크립트와 한 쌍으로 동작).
  (function () {
    var segments = location.pathname.split("/").filter(Boolean);
    var base = segments.length ? "/" + segments[0] + "/" : "/";
    var path = location.pathname.slice(base.length - 1) + location.search + location.hash;
    sessionStorage.setItem("gr-redirect-path", path);
    location.replace(location.origin + base + "index.html");
  })();
</script>
</head>
<body></body>
</html>
